[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdad-fullstack"
version = "0.2.0"
description = "Multi-language test impact analysis. Fork of tdad with tree-sitter JS/TS/Vue/Go support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ZhenSiRong", email = "1274338196@qq.com" },
    { name = "Rafael Alonso (upstream)", email = "pepealonso95@gmail.com" },
]
keywords = ["tdd", "graphrag", "testing", "ai", "multi-language", "tree-sitter", "vue", "typescript", "fullstack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "networkx>=3.0",
    "pydantic-settings>=2.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.14.0"]
coverage = ["coverage>=7.0.0"]
# Multi-language support (added in this fork)
js = [
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
]
ts = [
    "tree-sitter>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
vue = [
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-vue>=0.0.6",
]
go = [
    "tree-sitter>=0.21.0",
    "tree-sitter-go>=0.21.0",
]
fullstack = [
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-vue>=0.0.6",
    "tree-sitter-go>=0.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
tdad = "tdad.cli:main"
tdad-fullstack = "tdad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tdad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
