[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdad-fullstack"
version = "0.2.1"
description = "Test impact analysis for fullstack repos. Fork of tdad v0.2.0 with Vue SFC support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ZhenSiRong", email = "1274338196@qq.com" },
    { name = "Rafael Alonso (upstream)", email = "pepealonso95@gmail.com" },
]
keywords = ["tdd", "graphrag", "testing", "ai", "multi-language", "tree-sitter", "vue", "typescript", "fullstack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "networkx>=3.0",
    "pydantic-settings>=2.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.14.0"]
coverage = ["coverage>=7.0.0"]
# Multi-language tree-sitter support (inherited from upstream v0.2.0)
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]
treesitter-go = ["tree-sitter>=0.23", "tree-sitter-go"]
treesitter-java = ["tree-sitter>=0.23", "tree-sitter-java"]
treesitter-rust = ["tree-sitter>=0.23", "tree-sitter-rust"]
treesitter-dart = ["tree-sitter>=0.23", "tree-sitter-dart-orchard"]
treesitter-all = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-rust",
    "tree-sitter-dart-orchard",
]
# Vue SFC support (this fork's delta over upstream v0.2.0)
vue = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript",
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
tdad = "tdad.cli:main"
tdad-fullstack = "tdad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tdad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
